<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>데이터베이스 설계 및 SQL 문제해결 시나리오 평가 - 세부 성적표(요약)</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f9fafb;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
    }

    .page {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 18px 40px;
    }

    header {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 22px 18px;
      background: linear-gradient(180deg, var(--soft), #fff);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      letter-spacing: -0.2px;
    }

    h2 {
      font-size: 16px;
      margin: 22px 0 10px;
      letter-spacing: -0.2px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .meta {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      font-size: 14px;
    }

    .meta .row {
      display: flex;
      gap: 10px;
      align-items: baseline;
      white-space: nowrap;
    }

    .label {
      color: var(--muted);
      min-width: 84px;
    }

    .fill {
      flex: 1;
      border-bottom: 1px solid var(--line);
      min-height: 18px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    th,
    td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      text-align: left;
      background: var(--soft);
      color: #111827;
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: 0
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .total-row td {
      font-weight: 700;
      background: #fcfcfd;
    }

    .section {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      background: #fff;
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 18px;
      margin-top: 10px;
      font-size: 14px;
    }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .box {
      width: 18px;
      height: 18px;
      border: 2px solid #9ca3af;
      border-radius: 4px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .check span {
      flex: 1;
    }

    .muted {
      color: var(--muted)
    }

    .opinion {
      min-height: 110px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 12px 14px;
      white-space: pre-wrap;
      color: #111827;
    }

    footer {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-end;
      color: var(--muted);
      font-size: 13px;
    }

    .sign {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    .sign .fill {
      min-width: 180px
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(37, 99, 235, .10);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: middle;
    }

    @media print {
      body {
        background: #fff
      }

      .page {
        margin: 0;
        max-width: none
      }

      header,
      table,
      .section {
        break-inside: avoid
      }

      a {
        color: inherit;
        text-decoration: none
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>데이터베이스 설계 및 SQL 문제해결 시나리오 평가 <span class="badge">세부 성적표(요약)</span></h1>
      <p class="subtitle">실습 기반 문제해결 시나리오 평가용 요약 성적표</p>

      <div class="meta">
        <div class="row">
          <div class="label">평가일시</div>
          <div class="fill">2026-01-12</div>
        </div>
        <div class="row">
          <div class="label">과목</div>
          <div class="fill">데이터베이스 설계 / SQL</div>
        </div>
        <div class="row">
          <div class="label">수강생</div>
          <div class="fill"></div>
        </div>
        <div class="row">
          <div class="label">평가자</div>
          <div class="fill">류근철</div>
        </div>
      </div>
    </header>

    <h2>점수 요약 (총점 100점)</h2>
    <table aria-label="점수 요약 표">
      <thead>
        <tr>
          <th style="width:52%">항목</th>
          <th class="num" style="width:18%">배점</th>
          <th class="num" style="width:30%">득점</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>사전 환경 구성</td>
          <td class="num">20</td>
          <td class="num"></td>
        </tr>
        <tr>
          <td>문제 1. FK 삭제</td>
          <td class="num">20</td>
          <td class="num"></td>
        </tr>
        <tr>
          <td>문제 2. 성능 문제</td>
          <td class="num">20</td>
          <td class="num"></td>
        </tr>
        <tr>
          <td>문제 3. 데이터 품질</td>
          <td class="num">20</td>
          <td class="num"></td>
        </tr>
        <tr>
          <td>문제 4. 비정규화</td>
          <td class="num">20</td>
          <td class="num"></td>
        </tr>
        <tr class="total-row">
          <td>총점</td>
          <td class="num">100</td>
          <td class="num"></td>
        </tr>
      </tbody>
    </table>



    <h2>종합 의견</h2>
    <div class="opinion"></div>
  </div>
</body>

</html>
